apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      initContainers:
        - name: install-trace
          image: argocd-trace:v1.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: EXTENSIONS_DIR
              value: /tmp/extensions
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
